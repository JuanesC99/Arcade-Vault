<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piezas Sueltas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧩</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07060d; --panel:#12101f; --panel2:#1b1830; --edge:#2e2a4a;
  --ink:#e9e5ff; --dim:#8b83b4; --neon:#ff2e88; --volt:#35f0d0; --amber:#ffb020;
  --pixel:'Press Start 2P', monospace;
  --body:'Chakra Petch', 'Trebuchet MS', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--body);min-height:100vh;
     display:flex;align-items:center;justify-content:center;padding:20px;gap:26px;flex-wrap:wrap}
body::before{content:'';position:fixed;inset:0;z-index:99;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px)}
h1{font-family:var(--pixel);font-size:13px;margin-bottom:18px;text-shadow:2px 2px 0 var(--neon)}
.stage{position:relative;border:1px solid var(--edge);background:#05040c;padding:14px;
       box-shadow:0 0 0 6px var(--panel), 0 20px 60px rgba(0,0,0,.7)}

#tablero{
  display:grid; gap:3px; position:relative;
  touch-action:none; user-select:none;
}

.pieza{
  position:relative;
  background-repeat:no-repeat;
  border:1px solid rgba(46,42,74,.9);
  cursor:grab;
  transition:box-shadow .14s, filter .14s, transform .14s;
}
.pieza:hover{filter:brightness(1.12)}
.pieza.origen{filter:brightness(.32) saturate(.4);cursor:grabbing}
.pieza.destino{
  box-shadow:inset 0 0 0 3px var(--volt);
  filter:brightness(1.25);
}
.pieza.encajada{border-color:rgba(53,240,208,.55)}

/* la pieza que va en la mano: levantada, girada y con sombra larga */
#mano{
  position:fixed; top:0; left:0; z-index:60;
  pointer-events:none;
  background-repeat:no-repeat;
  border:1px solid rgba(233,229,255,.5);
  transform-origin:center;
  transform:translate(-50%,-50%) scale(calc(1.14 * var(--escala, 1))) rotate(-3deg);
  box-shadow:
    0 26px 38px rgba(0,0,0,.75),
    0 10px 14px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.10);
  filter:brightness(1.18) saturate(1.1);
  animation:levantar .14s ease-out;
}
@keyframes levantar{
  from{transform:translate(-50%,-50%) scale(var(--escala, 1)) rotate(0deg);box-shadow:0 0 0 rgba(0,0,0,0)}
  to{transform:translate(-50%,-50%) scale(calc(1.14 * var(--escala, 1))) rotate(-3deg)}
}

/* sombra proyectada en el hueco de origen, para que se note el relieve */
#sombra{
  position:fixed; top:0; left:0; z-index:55;
  pointer-events:none;
  background:rgba(0,0,0,.55);
  filter:blur(9px);
  transform:translate(-50%,-50%) scale(calc(1.02 * var(--escala, 1)));
}

.resuelto #tablero{animation:brillo .9s ease-out}
@keyframes brillo{
  0%{filter:brightness(2) saturate(1.6)}
  100%{filter:none}
}

.side{width:210px}
.box{border:1px solid var(--edge);background:var(--panel);padding:13px 14px;margin-bottom:12px}
.box h2{font-family:var(--pixel);font-size:9px;color:var(--volt);margin-bottom:9px}
.box .val{font-family:var(--pixel);font-size:15px;color:var(--amber)}
.keys{font-size:12px;color:var(--dim);line-height:1.9}
.keys b{color:var(--ink);font-weight:600}
.fila{display:flex;gap:5px}
.fila button{
  flex:1;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.6px;
  text-transform:uppercase;cursor:pointer;border:1px solid var(--edge);
  background:transparent;color:var(--dim);padding:6px 2px;
}
.fila button.on{background:var(--volt);border-color:var(--volt);color:var(--void)}
.fila button:hover{color:var(--ink)}
.fila button.on:hover{color:var(--void)}
#verOriginal{
  width:100%;font-family:var(--pixel);font-size:9px;cursor:pointer;
  border:1px solid var(--edge);background:var(--panel2);color:var(--ink);padding:10px;
}
#verOriginal:hover{border-color:var(--volt);color:var(--volt)}
.back{display:inline-block;margin-top:4px;font-family:var(--pixel);font-size:8px;
      color:var(--void);background:var(--volt);padding:9px 11px;text-decoration:none}
.back:hover{background:var(--neon);color:#12000a}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:rgba(5,4,12,.9);text-align:center;padding:20px;z-index:70}
.overlay.show{display:flex}
.overlay p{font-family:var(--pixel);font-size:14px;line-height:1.9}
.overlay small{color:var(--dim);font-size:13px;display:block;margin-top:6px}
.overlay button{font-family:var(--pixel);font-size:10px;border:0;cursor:pointer;
  background:var(--neon);color:#12000a;padding:13px 18px}
.overlay button:hover{background:var(--volt);color:var(--void)}
#original{
  position:absolute;inset:14px;z-index:65;display:none;
  background-repeat:no-repeat;background-size:cover;
  border:1px solid var(--volt);
}
#original.show{display:block}
</style>
</head>
<body>

<div>
  <h1>PIEZAS SUELTAS</h1>
  <div class="stage" id="stage">
    <div id="tablero"></div>
    <div id="original"></div>
    <div class="overlay" id="over">
      <p id="overTitle">ARMADO</p>
      <small id="overText"></small>
      <button id="overBtn">OTRO CUADRO</button>
    </div>
  </div>
</div>

<div class="side">
  <div class="box"><h2>MOVIMIENTOS</h2><div class="val" id="movs">0</div></div>
  <div class="box"><h2>TIEMPO</h2><div class="val" id="tiempo">0</div></div>
  <div class="box"><h2>EN SU SITIO</h2><div class="val" id="encajadas">0</div></div>
  <div class="box ancho">
    <h2>TAMAÑO</h2>
    <div class="fila" id="tamanos">
      <button data-n="3">3×3</button>
      <button data-n="4" class="on">4×4</button>
      <button data-n="5">5×5</button>
    </div>
  </div>
  <div class="box ancho">
    <h2>CUADRO</h2>
    <div class="fila" id="cuadros">
      <button data-c="0" class="on">1</button>
      <button data-c="1">2</button>
      <button data-c="2">3</button>
    </div>
  </div>
  <div class="box"><button id="verOriginal">VER ORIGINAL</button></div>
  <div class="box ancho solo-texto">
    <h2>CONTROLES</h2>
    <div class="keys">
      <b>Arrastra</b> una pieza sobre otra<br>
      <b>Espacio</b> ver el original<br>
      <b>R</b> barajar de nuevo
    </div>
  </div>
  <a class="back" href="../04-arcade-vault/index.html">&lt; VOLVER AL SALÓN</a>
</div>

<script src="../04-arcade-vault/cuentas.js"></script>
<script src="../04-arcade-vault/salon.js"></script>
<script src="../04-arcade-vault/pantalla.js"></script>
<script>window.MANDO = { acciones: [{ k:'r', txt:'BARAJAR' }] };</script>
<script src="../04-arcade-vault/movil.js"></script>
<script>
const LADO = 460;          // lado del tablero en píxeles
let N = 4;                 // piezas por lado
let cuadro = 0;            // qué dibujo se está armando
let orden = [];            // orden[casilla] = índice de la pieza que hay allí
let piezas = [];           // los divs, uno por casilla
let imagen = '';           // el dibujo como data URL
let movs = 0, t0 = 0, cron = null, estado = 'jugando';

const tablero = document.getElementById('tablero');
const original = document.getElementById('original');
const stage = document.getElementById('stage');

const el = {
  movs: document.getElementById('movs'),
  tiempo: document.getElementById('tiempo'),
  encajadas: document.getElementById('encajadas'),
  over: document.getElementById('over'),
  overTitle: document.getElementById('overTitle'),
  overText: document.getElementById('overText'),
  overBtn: document.getElementById('overBtn'),
};

/* ------------------------------------------------------------
   Los cuadros se dibujan con canvas, así no hace falta ninguna
   imagen externa y el archivo sigue siendo autocontenido.
   ------------------------------------------------------------ */
function pintarCuadro(cual){
  const c = document.createElement('canvas');
  c.width = c.height = LADO;
  const x = c.getContext('2d');

  if(cual === 0){
    // atardecer sintético
    const g = x.createLinearGradient(0, 0, 0, LADO);
    g.addColorStop(0, '#2a0a3d'); g.addColorStop(.55, '#7a1050'); g.addColorStop(1, '#ff6a3d');
    x.fillStyle = g; x.fillRect(0, 0, LADO, LADO);

    x.fillStyle = '#ffe066';
    x.beginPath(); x.arc(LADO/2, LADO*.46, LADO*.20, 0, Math.PI*2); x.fill();
    x.fillStyle = 'rgba(122,16,80,.85)';
    for(let i = 0; i < 7; i++) x.fillRect(LADO*.28, LADO*.40 + i*16, LADO*.44, 7);

    x.fillStyle = '#12061e';
    x.beginPath();
    x.moveTo(0, LADO*.72);
    x.lineTo(LADO*.22, LADO*.55); x.lineTo(LADO*.40, LADO*.70);
    x.lineTo(LADO*.62, LADO*.48); x.lineTo(LADO*.82, LADO*.68);
    x.lineTo(LADO, LADO*.58); x.lineTo(LADO, LADO); x.lineTo(0, LADO);
    x.closePath(); x.fill();

    x.strokeStyle = 'rgba(53,240,208,.5)'; x.lineWidth = 1;
    for(let i = 1; i < 12; i++){
      const yy = LADO*.72 + (i*i) * 1.6;
      if(yy > LADO) break;
      x.beginPath(); x.moveTo(0, yy); x.lineTo(LADO, yy); x.stroke();
    }
  }

  if(cual === 1){
    // circuito
    x.fillStyle = '#06121f'; x.fillRect(0, 0, LADO, LADO);
    x.strokeStyle = 'rgba(53,240,208,.75)'; x.lineWidth = 3;
    for(let i = 0; i < 26; i++){
      let px = Math.floor(Math.random()*10)*(LADO/10);
      let py = Math.floor(Math.random()*10)*(LADO/10);
      x.beginPath(); x.moveTo(px, py);
      for(let p = 0; p < 4; p++){
        if(Math.random() < .5) px += (Math.random()<.5?-1:1)*(LADO/10);
        else py += (Math.random()<.5?-1:1)*(LADO/10);
        x.lineTo(px, py);
      }
      x.stroke();
      x.fillStyle = '#ff2e88';
      x.fillRect(px-4, py-4, 8, 8);
    }
    x.fillStyle = 'rgba(255,176,32,.9)';
    for(let i = 0; i < 34; i++)
      x.fillRect(Math.random()*LADO, Math.random()*LADO, 5, 5);
  }

  if(cual === 2){
    // vidriera
    x.fillStyle = '#0d0b18'; x.fillRect(0, 0, LADO, LADO);
    const cols = ['#ff2e88','#35f0d0','#ffb020','#7c6bff','#7ce85c','#ff5a5a'];
    for(let i = 0; i < 16; i++){
      x.fillStyle = cols[i % cols.length];
      x.globalAlpha = .78;
      x.beginPath();
      const cx2 = Math.random()*LADO, cy2 = Math.random()*LADO, r = 40 + Math.random()*110;
      const lados = 3 + Math.floor(Math.random()*4);
      for(let s = 0; s <= lados; s++){
        const a = (s/lados)*Math.PI*2 + i;
        const px = cx2 + Math.cos(a)*r, py = cy2 + Math.sin(a)*r;
        s ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.closePath(); x.fill();
    }
    x.globalAlpha = 1;
    x.strokeStyle = '#05040c'; x.lineWidth = 6;
    for(let i = 0; i <= 6; i++){
      x.beginPath(); x.moveTo(i*LADO/6, 0); x.lineTo(i*LADO/6, LADO); x.stroke();
      x.beginPath(); x.moveTo(0, i*LADO/6); x.lineTo(LADO, i*LADO/6); x.stroke();
    }
  }

  return c.toDataURL();
}

function barajar(){
  do {
    orden = [...Array(N*N).keys()];
    for(let i = orden.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [orden[i], orden[j]] = [orden[j], orden[i]];
    }
  } while(orden.every((v, i) => v === i));   // nunca empezar resuelto
}

function tamPieza(){
  return (LADO - (N - 1) * 3) / N;
}

function estiloPieza(div, pieza){
  const p = tamPieza();
  const col = pieza % N, fil = Math.floor(pieza / N);
  div.style.backgroundImage = `url(${imagen})`;
  div.style.backgroundSize = `${p * N}px ${p * N}px`;
  div.style.backgroundPosition = `${-col * p}px ${-fil * p}px`;
}

function construir(){
  const p = tamPieza();
  tablero.style.gridTemplateColumns = `repeat(${N}, ${p}px)`;
  tablero.style.gridTemplateRows = `repeat(${N}, ${p}px)`;
  tablero.innerHTML = '';
  piezas = [];
  for(let i = 0; i < N*N; i++){
    const d = document.createElement('div');
    d.className = 'pieza';
    d.style.width = p + 'px';
    d.style.height = p + 'px';
    d.dataset.casilla = i;
    tablero.appendChild(d);
    piezas.push(d);
  }
  original.style.backgroundImage = `url(${imagen})`;
  pintarTodo();
}

function pintarTodo(){
  let bien = 0;
  orden.forEach((pieza, casilla) => {
    const d = piezas[casilla];
    estiloPieza(d, pieza);
    const encajada = pieza === casilla;
    d.classList.toggle('encajada', encajada);
    if(encajada) bien++;
  });
  el.encajadas.textContent = bien + ' / ' + (N*N);
  el.movs.textContent = movs;
}

function nueva(){
  imagen = pintarCuadro(cuadro);
  barajar();
  movs = 0;
  estado = 'jugando';
  stage.classList.remove('resuelto');
  el.over.classList.remove('show');
  construir();
  clearInterval(cron);
  t0 = Date.now();
  el.tiempo.textContent = '0';
  cron = setInterval(() => {
    if(estado === 'jugando') el.tiempo.textContent = Math.floor((Date.now() - t0) / 1000);
  }, 250);
}

function comprobar(){
  if(!orden.every((v, i) => v === i)) return;
  estado = 'fin';
  clearInterval(cron);
  stage.classList.add('resuelto');
  window.Hall && Hall.registrar('13-rompecabezas', Number(el.tiempo.textContent), { unidad: 's', menorEsMejor: true, etiqueta: N + '×' + N });
  el.overTitle.textContent = 'ARMADO';
  el.overText.textContent = movs + ' movimientos en ' + el.tiempo.textContent + ' segundos';
  setTimeout(() => el.over.classList.add('show'), 700);
}

/* ------------------------------------------------------------
   Arrastre: al agarrar se crea una copia que sigue al puntero,
   ampliada y con sombra, y el hueco de origen queda apagado.
   ------------------------------------------------------------ */
let mano = null, sombra = null, casillaOrigen = null, casillaDestino = null;

function crearMano(casilla, x, y){
  const p = tamPieza();

  sombra = document.createElement('div');
  sombra.id = 'sombra';
  sombra.style.width = p + 'px';
  sombra.style.height = p + 'px';
  document.body.appendChild(sombra);

  mano = document.createElement('div');
  mano.id = 'mano';
  mano.style.width = p + 'px';
  mano.style.height = p + 'px';
  estiloPieza(mano, orden[casilla]);
  document.body.appendChild(mano);

  piezas[casilla].classList.add('origen');
  moverMano(x, y);
}

function moverMano(x, y){
  if(!mano) return;
  mano.style.left = x + 'px';
  mano.style.top = y + 'px';
  // la sombra cae un poco por debajo y a la derecha, como si hubiera una luz arriba
  sombra.style.left = (x + 7) + 'px';
  sombra.style.top = (y + 16) + 'px';
}

function soltarMano(){
  if(mano){ mano.remove(); mano = null; }
  if(sombra){ sombra.remove(); sombra = null; }
  piezas.forEach(p => p.classList.remove('origen', 'destino'));
  casillaOrigen = null;
  casillaDestino = null;
}

function casillaBajoPuntero(x, y){
  if(mano) mano.style.display = 'none';
  if(sombra) sombra.style.display = 'none';
  const bajo = document.elementFromPoint(x, y);
  if(mano) mano.style.display = '';
  if(sombra) sombra.style.display = '';
  const pieza = bajo && bajo.closest ? bajo.closest('.pieza') : null;
  return pieza ? +pieza.dataset.casilla : null;
}

tablero.addEventListener('pointerdown', e => {
  if(estado !== 'jugando') return;
  const d = e.target.closest('.pieza');
  if(!d) return;
  e.preventDefault();
  casillaOrigen = +d.dataset.casilla;
  crearMano(casillaOrigen, e.clientX, e.clientY);
  tablero.setPointerCapture(e.pointerId);
});

tablero.addEventListener('pointermove', e => {
  if(casillaOrigen === null) return;
  moverMano(e.clientX, e.clientY);

  const sobre = casillaBajoPuntero(e.clientX, e.clientY);
  if(sobre !== casillaDestino){
    piezas.forEach(p => p.classList.remove('destino'));
    casillaDestino = sobre;
    if(sobre !== null && sobre !== casillaOrigen) piezas[sobre].classList.add('destino');
  }
});

function terminarArrastre(e){
  if(casillaOrigen === null) return;
  const destino = casillaBajoPuntero(e.clientX, e.clientY);
  const origen = casillaOrigen;
  soltarMano();

  if(destino === null || destino === origen){ pintarTodo(); return; }

  [orden[origen], orden[destino]] = [orden[destino], orden[origen]];
  movs++;
  pintarTodo();
  comprobar();
}

tablero.addEventListener('pointerup', terminarArrastre);
tablero.addEventListener('pointercancel', () => soltarMano());

/* ---------------- ver el original ---------------- */
const verOriginal = document.getElementById('verOriginal');
const mostrarOriginal = v => original.classList.toggle('show', v);

verOriginal.addEventListener('pointerdown', () => mostrarOriginal(true));
verOriginal.addEventListener('pointerup', () => mostrarOriginal(false));
verOriginal.addEventListener('pointerleave', () => mostrarOriginal(false));

document.addEventListener('keydown', e => {
  if(e.key === ' '){ e.preventDefault(); mostrarOriginal(true); }
  if(e.key.toLowerCase() === 'r') nueva();
});
document.addEventListener('keyup', e => {
  if(e.key === ' ') mostrarOriginal(false);
});

/* ---------------- ajustes ---------------- */
document.getElementById('tamanos').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  document.querySelectorAll('#tamanos button').forEach(o => o.classList.remove('on'));
  b.classList.add('on');
  N = +b.dataset.n;
  nueva();
});

document.getElementById('cuadros').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  document.querySelectorAll('#cuadros button').forEach(o => o.classList.remove('on'));
  b.classList.add('on');
  cuadro = +b.dataset.c;
  nueva();
});

el.overBtn.addEventListener('click', () => {
  cuadro = (cuadro + 1) % 3;
  document.querySelectorAll('#cuadros button').forEach(o => o.classList.toggle('on', +o.dataset.c === cuadro));
  nueva();
});

nueva();
</script>

</body>
</html>
