<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoria Neón</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07060d; --panel:#12101f; --edge:#2e2a4a;
  --ink:#e9e5ff; --dim:#8b83b4; --neon:#ff2e88; --volt:#35f0d0; --amber:#ffb020;
  --pixel:'Press Start 2P', monospace;
  --body:'Chakra Petch', 'Trebuchet MS', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--body);min-height:100vh;
     display:flex;align-items:center;justify-content:center;padding:20px;gap:26px;flex-wrap:wrap}
body::before{content:'';position:fixed;inset:0;z-index:99;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px)}
h1{font-family:var(--pixel);font-size:13px;margin-bottom:18px;text-shadow:2px 2px 0 var(--neon)}
.stage{position:relative;border:1px solid var(--edge);background:#05040c;padding:28px;
       box-shadow:0 0 0 6px var(--panel), 0 20px 60px rgba(0,0,0,.7)}
.pad{display:grid;grid-template-columns:repeat(2,150px);grid-template-rows:repeat(2,150px);gap:14px}
.tecla{
  border:2px solid var(--edge); cursor:pointer; position:relative;
  transition:filter .1s, transform .1s;
  filter:brightness(.42) saturate(.8);
}
.tecla:hover{filter:brightness(.6)}
.tecla.viva{filter:brightness(1.5) saturate(1.3);transform:scale(1.03)}
.tecla span{
  position:absolute;bottom:8px;right:10px;font-family:var(--pixel);font-size:9px;
  color:rgba(0,0,0,.55);
}
#t0{background:#ff2e88}
#t1{background:#35f0d0}
#t2{background:#ffb020}
#t3{background:#7c6bff}
.centro{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:98px;height:98px;border-radius:50%;background:var(--void);
  border:2px solid var(--edge);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;pointer-events:none;
}
.centro b{font-family:var(--pixel);font-size:17px;color:var(--amber)}
.centro small{font-size:10px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
.side{width:196px}
.box{border:1px solid var(--edge);background:var(--panel);padding:13px 14px;margin-bottom:12px}
.box h2{font-family:var(--pixel);font-size:9px;color:var(--volt);margin-bottom:9px}
.box .val{font-family:var(--pixel);font-size:15px;color:var(--amber)}
.keys{font-size:12px;color:var(--dim);line-height:1.9}
.keys b{color:var(--ink);font-weight:600}
.back{display:inline-block;margin-top:4px;font-family:var(--pixel);font-size:8px;
      color:var(--void);background:var(--volt);padding:9px 11px;text-decoration:none}
.back:hover{background:var(--neon);color:#12000a}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:rgba(5,4,12,.9);text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay p{font-family:var(--pixel);font-size:14px;line-height:1.9}
.overlay small{color:var(--dim);font-size:13px;display:block;margin-top:6px}
.overlay button{font-family:var(--pixel);font-size:10px;border:0;cursor:pointer;
  background:var(--neon);color:#12000a;padding:13px 18px}
.overlay button:hover{background:var(--volt);color:var(--void)}
</style>
</head>
<body>

<div>
  <h1>MEMORIA NEÓN</h1>
  <div class="stage">
    <div class="pad">
      <div class="tecla" id="t0" data-i="0"><span>Q</span></div>
      <div class="tecla" id="t1" data-i="1"><span>W</span></div>
      <div class="tecla" id="t2" data-i="2"><span>A</span></div>
      <div class="tecla" id="t3" data-i="3"><span>S</span></div>
    </div>
    <div class="centro"><b id="ronda">0</b><small id="fase">Listo</small></div>
    <div class="overlay show" id="over">
      <p id="overTitle">MEMORIA NEÓN</p>
      <small id="overText">Repite la secuencia. Cada ronda añade una luz</small>
      <button id="overBtn">EMPEZAR</button>
    </div>
  </div>
</div>

<div class="side">
  <div class="box"><h2>RONDA</h2><div class="val" id="rondaLat">0</div></div>
  <div class="box"><h2>RÉCORD</h2><div class="val" id="best">0</div></div>
  <div class="box">
    <h2>CONTROLES</h2>
    <div class="keys">
      <b>Clic</b> en las luces<br>
      <b>Q W A S</b> también<br>
      <b>P</b> pausa
    </div>
  </div>
  <div class="box">
    <h2>REGLAS</h2>
    <div class="keys">La secuencia crece una luz por ronda y se reproduce más rápido. Un fallo termina la partida.</div>
  </div>
  <a class="back" href="../04-arcade-vault/index.html">&lt; VOLVER AL SALÓN</a>
</div>

<script src="../04-arcade-vault/salon.js"></script>
<script>
const TECLAS = [...document.querySelectorAll('.tecla')];
const NOTAS = [329.63, 392.00, 493.88, 587.33];
const LETRAS = ['q', 'w', 'a', 's'];

let secuencia = [], paso = 0, ronda = 0, best = 0, estado = 'menu', audio = null;

const el = {
  ronda: document.getElementById('ronda'),
  fase: document.getElementById('fase'),
  rondaLat: document.getElementById('rondaLat'),
  best: document.getElementById('best'),
  over: document.getElementById('over'),
  overTitle: document.getElementById('overTitle'),
  overText: document.getElementById('overText'),
  overBtn: document.getElementById('overBtn'),
};

function tono(i, dur = 0.26){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gan = audio.createGain();
    osc.type = 'square';
    osc.frequency.value = NOTAS[i];
    gan.gain.setValueAtTime(0.0001, audio.currentTime);
    gan.gain.exponentialRampToValueAtTime(0.09, audio.currentTime + 0.02);
    gan.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    osc.connect(gan).connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + dur);
  }catch(e){ /* sin audio disponible, el juego sigue */ }
}

const esperar = ms => new Promise(r => setTimeout(r, ms));

async function encender(i, ms){
  TECLAS[i].classList.add('viva');
  tono(i, ms / 1000);
  await esperar(ms);
  TECLAS[i].classList.remove('viva');
  await esperar(Math.max(70, ms * 0.35));
}

function pintarHud(){
  el.ronda.textContent = ronda;
  el.rondaLat.textContent = ronda;
  el.best.textContent = best;
}

async function siguienteRonda(){
  ronda++;
  secuencia.push(Math.floor(Math.random() * 4));
  paso = 0;
  pintarHud();
  el.fase.textContent = 'Mira';
  estado = 'mostrando';
  await esperar(560);
  const ms = Math.max(180, 520 - ronda * 22);
  for(const i of secuencia){
    if(estado !== 'mostrando') return;
    await encender(i, ms);
  }
  estado = 'tu turno';
  el.fase.textContent = 'Repite';
}

function fallar(){
  estado = 'fin';
  best = Math.max(best, ronda - 1);
  window.Hall && Hall.registrar('10-simon', ronda - 1, { unidad: 'rondas' });
  el.fase.textContent = 'Fallo';
  el.overTitle.textContent = 'SE CORTÓ';
  el.overText.textContent = 'Llegaste a la ronda ' + ronda;
  el.overBtn.textContent = 'OTRA PARTIDA';
  el.over.classList.add('show');
  pintarHud();
}

async function pulsar(i){
  if(estado !== 'tu turno') return;
  await encender(i, 170);
  if(secuencia[paso] !== i) return fallar();
  paso++;
  if(paso === secuencia.length){
    estado = 'esperando';
    el.fase.textContent = 'Bien';
    await esperar(360);
    siguienteRonda();
  }
}

function arrancar(){
  secuencia = [];
  ronda = 0;
  paso = 0;
  el.over.classList.remove('show');
  pintarHud();
  siguienteRonda();
}

TECLAS.forEach(t => t.addEventListener('click', () => pulsar(+t.dataset.i)));

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(k === 'p'){
    if(estado === 'tu turno' || estado === 'mostrando'){
      estado = 'pausa';
      el.fase.textContent = 'Pausa';
      el.overTitle.textContent = 'PAUSA';
      el.overText.textContent = 'La secuencia se repite al volver';
      el.overBtn.textContent = 'SEGUIR';
      el.over.classList.add('show');
    }
    return;
  }
  const i = LETRAS.indexOf(k);
  if(i >= 0) pulsar(i);
});

el.overBtn.addEventListener('click', () => {
  if(estado === 'pausa'){
    // retomamos repitiendo la secuencia actual desde el principio
    el.over.classList.remove('show');
    paso = 0;
    ronda--;
    secuencia.pop();
    siguienteRonda();
  } else {
    arrancar();
  }
});

pintarHud();
</script>

</body>
</html>
